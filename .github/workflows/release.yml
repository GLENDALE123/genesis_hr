name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.2.0 같은 태그가 푸시될 때 실행

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Get version from tag and update files
        shell: bash
        run: |
          # 태그에서 버전 추출 (v0.2.0 -> 0.2.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "=== Updating version to: $VERSION ==="
          
          # package.json 버전 업데이트
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          
          # 확인
          echo "=== Verification ==="
          UPDATED_VERSION=$(node -p "require('./package.json').version")
          echo "Updated package.json version: $UPDATED_VERSION"
          echo "Expected version: $VERSION"
          
          if [ "$UPDATED_VERSION" != "$VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi
          
          # installer.nsi 버전 업데이트
          if [ -f "build/installer.nsi" ]; then
            if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "win32" ]]; then
              # Windows 환경에서 sed 대신 PowerShell 사용
              powershell -Command "(Get-Content build/installer.nsi -Raw -Encoding UTF8) -replace '!define APP_VERSION \"[^\"]*\"', \"!define APP_VERSION \`\"$VERSION\`\"\" | Set-Content build/installer.nsi -Encoding UTF8"
            else
              sed -i "s/!define APP_VERSION \".*\"/!define APP_VERSION \"$VERSION\"/" build/installer.nsi
            fi
            echo "installer.nsi version updated to $VERSION"
          else
            echo "ERROR: installer.nsi not found"
            exit 1
          fi
          
          # 최종 확인
          echo "=== Final package.json check ==="
          head -5 package.json
          
      - name: Install NSIS
        run: |
          choco install nsis -y || echo "NSIS installation skipped (may already be installed)"
        continue-on-error: true
          
      - name: Build Next.js (Electron)
        run: npm run build
        env:
          ELECTRON_BUILD: true
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_NUMBER: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_NUMBER }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID }}
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID }}
          
      - name: Package Electron app (dir - for custom installer)
        run: |
          # Electron 앱 패키징 (dir 타겟으로 - 아이콘 생성 및 파일 준비)
          npx electron-builder --win --x64 --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: false
        
      - name: Build custom NSIS installer
        run: |
          # 커스텀 NSIS 인스톨러 빌드 (아이콘 파일이 생성된 후)
          npm run installer:build
        continue-on-error: false
        
      - name: Package Electron app (portable - for delta updates)
        run: |
          # Portable 버전만 빌드 (delta 업데이트용)
          # portable 타겟만 지정하여 NSIS 빌드 건너뛰기
          npx electron-builder --win portable --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: false
          
      - name: List build artifacts
        run: |
          Write-Host "=== 설치 파일 ==="
          Get-ChildItem dist -Filter "TMS-Setup-*.exe" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "`n=== Portable 파일 ==="
          Get-ChildItem dist -Filter "*.exe" -Exclude "TMS-Setup-*" | Where-Object { $_.Name -notlike "*.blockmap" } | ForEach-Object { Write-Host $_.FullName }
          Write-Host "`n=== 메타데이터 파일 ==="
          Get-ChildItem dist -Include "*.yml","*.blockmap" | ForEach-Object { Write-Host $_.FullName }
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TMS 통합관리시스템 v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 변경 사항
            
            자동으로 생성된 릴리스입니다.
            
            ## 설치 파일
            
            - **전체 설치**: `TMS-Setup-*.exe` (새로 설치하는 경우)
            - **업데이트**: `electron-updater`가 자동으로 delta 업데이트 파일을 사용합니다.
          files: |
            dist/TMS-Setup-*.exe
            dist/*-Integrated-Management*.exe
            dist/*.yml
            dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

