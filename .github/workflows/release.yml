name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.2.0 같은 태그가 푸시될 때 실행

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Get version from tag and update files
        shell: bash
        run: |
          # 태그에서 버전 추출 (v0.2.0 -> 0.2.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "=== Updating version to: $VERSION ==="
          
          # package.json 버전 업데이트
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          
          # 확인
          echo "=== Verification ==="
          UPDATED_VERSION=$(node -p "require('./package.json').version")
          echo "Updated package.json version: $UPDATED_VERSION"
          echo "Expected version: $VERSION"
          
          if [ "$UPDATED_VERSION" != "$VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi
          
          # installer.nsi 버전 업데이트
          if [ -f "build/installer.nsi" ]; then
            if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "win32" ]]; then
              # Windows 환경에서 sed 대신 PowerShell 사용
              powershell -Command "(Get-Content build/installer.nsi -Raw -Encoding UTF8) -replace '!define APP_VERSION \"[^\"]*\"', \"!define APP_VERSION \`\"$VERSION\`\"\" | Set-Content build/installer.nsi -Encoding UTF8"
            else
              sed -i "s/!define APP_VERSION \".*\"/!define APP_VERSION \"$VERSION\"/" build/installer.nsi
            fi
            echo "installer.nsi version updated to $VERSION"
          else
            echo "ERROR: installer.nsi not found"
            exit 1
          fi
          
          # 최종 확인
          echo "=== Final package.json check ==="
          head -5 package.json
          
      - name: Install NSIS
        run: |
          choco install nsis -y || echo "NSIS installation skipped (may already be installed)"
        continue-on-error: true
          
      - name: Build Next.js (Electron)
        run: npm run build
        env:
          ELECTRON_BUILD: true
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_NUMBER: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_NUMBER }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID }}
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID }}
          
      - name: Package Electron app (dir - for custom installer)
        run: |
          # Electron 앱 패키징 (dir 타겟으로 - 아이콘 생성 및 파일 준비)
          npx electron-builder --win --x64 --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: false
        
      - name: Build custom NSIS installer
        run: |
          # 커스텀 NSIS 인스톨러 빌드 (아이콘 파일이 생성된 후)
          npm run installer:build
        continue-on-error: false
        
      - name: Package Electron app (portable - for delta updates)
        run: |
          # Portable 버전만 빌드 (delta 업데이트용)
          # portable 타겟만 지정하여 NSIS 빌드 건너뛰기
          npx electron-builder --win portable --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: false
          
      - name: List build artifacts
        run: |
          Write-Host "=== 설치 파일 ==="
          Get-ChildItem dist -Filter "TMS-Setup-*.exe" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "`n=== Portable 파일 ==="
          Get-ChildItem dist -Filter "*.exe" -Exclude "TMS-Setup-*" | Where-Object { $_.Name -notlike "*.blockmap" } | ForEach-Object { Write-Host $_.FullName }
          Write-Host "`n=== 메타데이터 파일 ==="
          Get-ChildItem dist -Include "*.yml","*.blockmap" | ForEach-Object { Write-Host $_.FullName }
          
      - name: Setup Service Account Credentials
        run: |
          # 서비스 계정 키 파일 생성
          $CREDENTIALS_PATH = "${{ github.workspace }}\firebase-service-account.json"
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_HS_JIG_B2093 }}" | Out-File -FilePath $CREDENTIALS_PATH -Encoding utf8 -NoNewline
          
          Write-Host "서비스 계정 키 파일 생성됨: $CREDENTIALS_PATH"
          
          # 파일 존재 확인
          if (Test-Path $CREDENTIALS_PATH) {
            Write-Host "서비스 계정 키 파일 확인 완료"
          } else {
            Write-Host "ERROR: 서비스 계정 키 파일을 찾을 수 없습니다"
            exit 1
          }
          
          # 환경 변수 설정
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "GOOGLE_APPLICATION_CREDENTIALS 환경 변수 설정 완료"
          
      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HS_JIG_B2093 }}
          project_id: hs-jig-b2093
          export_default_credentials: true
          
      - name: Authenticate with Google Cloud
        run: |
          Write-Host "=== Google Cloud 인증 확인 ==="
          $CREDENTIALS_PATH = "${{ github.workspace }}\firebase-service-account.json"
          
          # gcloud 인증 설정
          gcloud auth activate-service-account --key-file="$CREDENTIALS_PATH"
          
          # 인증 확인
          Write-Host "인증된 계정:"
          gcloud auth list
          
          # 프로젝트 설정
          gcloud config set project hs-jig-b2093
          
          # gsutil 버전 확인
          gsutil --version
          
      - name: Create latest.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # 파일 크기 구하기 (PowerShell 사용)
          FILE_SIZE=$(powershell -Command "(Get-Item dist\\TMS-Setup-*.exe | Select-Object -First 1).Length")
          
          # latest.json 생성
          echo "{" > latest.json
          echo "  \"version\": \"$VERSION\"," >> latest.json
          echo "  \"fileName\": \"TMS-Setup-latest.exe\"," >> latest.json
          echo "  \"size\": $FILE_SIZE," >> latest.json
          echo "  \"publishedAt\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"" >> latest.json
          echo "}" >> latest.json
          
          echo "=== latest.json ==="
          cat latest.json
          
      - name: Upload to Firebase Storage
        run: |
          # Firebase Storage에 업로드 (gsutil 사용)
          # 설치 파일은 항상 같은 이름으로 업로드 (덮어쓰기)
          
          $BUCKET = "hs-jig-b2093.firebasestorage.app"
          $CREDENTIALS_PATH = "${{ github.workspace }}\firebase-service-account.json"
          
          Write-Host "=== Firebase Storage 업로드 시작 ==="
          Write-Host "버킷: $BUCKET"
          Write-Host "서비스 계정 키 파일: $CREDENTIALS_PATH"
          
          # 서비스 계정 키 파일 확인
          if (-not (Test-Path $CREDENTIALS_PATH)) {
            Write-Host "ERROR: 서비스 계정 키 파일을 찾을 수 없습니다: $CREDENTIALS_PATH"
            exit 1
          }
          
          # latest.json 업로드
          Write-Host "업로드 중: latest.json"
          & gsutil -o "Credentials:gs_service_key_file=$CREDENTIALS_PATH" cp latest.json "gs://$BUCKET/electron-releases/latest.json"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "latest.json 업로드 실패"
            exit 1
          }
          
          # 설치 파일 업로드 (이름 변경하여 덮어쓰기)
          $INSTALLER_FILE = (Get-ChildItem dist -Filter "TMS-Setup-*.exe" | Select-Object -First 1).FullName
          if ($INSTALLER_FILE) {
            Write-Host "업로드 중: TMS-Setup-latest.exe"
            & gsutil -o "Credentials:gs_service_key_file=$CREDENTIALS_PATH" cp "$INSTALLER_FILE" "gs://$BUCKET/electron-releases/TMS-Setup-latest.exe"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "설치 파일 업로드 실패"
              exit 1
            }
          }
          
          # portable 파일 업로드
          $PORTABLE_FILE = (Get-ChildItem dist -Filter "*Integrated-Management*.exe" | Select-Object -First 1).FullName
          if ($PORTABLE_FILE) {
            Write-Host "업로드 중: TMS-Integrated-Management-latest.exe"
            & gsutil -o "Credentials:gs_service_key_file=$CREDENTIALS_PATH" cp "$PORTABLE_FILE" "gs://$BUCKET/electron-releases/TMS-Integrated-Management-latest.exe"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "portable 파일 업로드 실패"
              exit 1
            }
          }
          
          # latest.yml 업로드
          $LATEST_YML = (Get-ChildItem dist -Filter "*.yml" | Select-Object -First 1).FullName
          if ($LATEST_YML) {
            Write-Host "업로드 중: latest.yml"
            & gsutil -o "Credentials:gs_service_key_file=$CREDENTIALS_PATH" cp "$LATEST_YML" "gs://$BUCKET/electron-releases/latest.yml"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "latest.yml 업로드 실패"
              exit 1
            }
          }
          
          # blockmap 파일 업로드
          Get-ChildItem dist -Filter "*.blockmap" | ForEach-Object {
            Write-Host "업로드 중: $($_.Name)"
            & gsutil -o "Credentials:gs_service_key_file=$CREDENTIALS_PATH" cp $_.FullName "gs://$BUCKET/electron-releases/$($_.Name)"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "$($_.Name) 업로드 실패"
              exit 1
            }
          }
          
          Write-Host "=== Firebase Storage 업로드 완료 ==="
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TMS 통합관리시스템 v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 변경 사항
            
            자동으로 생성된 릴리스입니다.
            
            ## 설치 파일
            
            - **전체 설치**: `TMS-Setup-*.exe` (새로 설치하는 경우)
            - **업데이트**: `electron-updater`가 자동으로 delta 업데이트 파일을 사용합니다.
          files: |
            dist/TMS-Setup-*.exe
            dist/*-Integrated-Management*.exe
            dist/*.yml
            dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

