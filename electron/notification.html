<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Light Mode Colors */
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 210 40% 98%;
      --border: 214.3 31.8% 91.4%;
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    /* Dark Mode Detection */
    @media (prefers-color-scheme: dark) {
      :root {
        --background: 220.9 52.4% 8.2%;
        --foreground: 210 40% 98%;
        --card: 222.2 47.4% 11.2%;
        --card-foreground: 210 40% 98%;
        --primary: 217.2 91.2% 59.8%;
        --primary-foreground: 222.2 47.4% 11.2%;
        --border: 220.9 52.4% 8.2%;
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
      }
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 
        'Segoe UI', 'Roboto', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 
        'Malgun Gothic', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      background: transparent;
      cursor: pointer;
      padding: 10px;
      margin: 0;
    }

    .notification {
      width: 330px;
      min-height: 130px;
      background: linear-gradient(
        135deg,
        hsl(var(--card) / 0.85) 0%,
        hsl(var(--card) / 0.75) 100%
      );
      border: 1px solid hsl(var(--border) / 0.4);
      border-radius: 0.75rem;
      box-shadow: 
        var(--shadow-lg),
        0 0 0 1px hsl(var(--primary) / 0.08),
        inset 0 1px 0 0 hsl(var(--primary-foreground) / 0.05);
      display: flex;
      flex-direction: column;
      padding: 0.875rem;
      gap: 0.5rem;
      color: hsl(var(--card-foreground));
      position: relative;
      overflow: hidden;
      filter: blur(0.3px);
    }
    
    .notification::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        hsl(var(--primary-foreground) / 0.05) 0%,
        transparent 50%,
        hsl(var(--primary) / 0.02) 100%
      );
      pointer-events: none;
      border-radius: 0.75rem;
    }

    .header-section {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.375rem;
      position: relative;
    }

    .title {
      position: absolute;
      left: 0;
      font-size: 0.6875rem;
      font-weight: 500;
      color: hsl(var(--card-foreground) / 0.6);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .title-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .center-info {
      font-size: 0.6875rem;
      font-weight: 600;
      color: hsl(var(--primary));
      padding: 0.125rem 0.5rem;
      background: hsl(var(--primary) / 0.1);
      border-radius: 0.25rem;
    }

    .middle-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.375rem;
    }

    .sender-info {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-shrink: 0;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: hsl(var(--muted));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: hsl(var(--muted-foreground));
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sender-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: hsl(var(--card-foreground));
      white-space: nowrap;
    }

    .subtitle {
      font-size: 0.75rem;
      font-weight: 500;
      color: hsl(var(--card-foreground) / 0.8);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .timestamp {
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      font-size: 0.625rem;
      color: hsl(var(--card-foreground) / 0.4);
      white-space: nowrap;
    }

    .body {
      font-size: 0.8125rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: hsl(var(--card-foreground));
      padding-right: 3.5rem;
    }

    .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: hsl(var(--primary) / 0.15);
      border: 1px solid hsl(var(--border) / 0.3);
      color: hsl(var(--card-foreground));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0.6;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      opacity: 1;
      background: hsl(var(--primary) / 0.25);
      transform: scale(1.1);
    }

    /* Slide in from right animation */
    @keyframes slideInFromRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Slide out to right animation */
    @keyframes slideOutToRight {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }

    .notification {
      animation: slideInFromRight 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .notification.closing {
      animation: slideOutToRight 0.2s cubic-bezier(0.55, 0.085, 0.68, 0.53);
    }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <button class="close-btn" id="closeBtn">×</button>
    
    <!-- 헤더: 타이틀 (좌측 상단) + 중앙 정보 (중앙 상단) -->
    <div class="header-section">
      <div class="title" id="title"></div>
      <div class="center-info" id="centerInfo" style="display: none;"></div>
    </div>
    
    <!-- 중간 섹션: 아바타+이름 (좌측) | 서브타이틀 (우측) -->
    <div class="middle-section">
      <div class="sender-info">
        <div class="avatar" id="avatar">👤</div>
        <div class="sender-name" id="senderName"></div>
      </div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    
    <!-- 바디 (메시지 본문) -->
    <div class="body" id="body"></div>
    
    <!-- 타임스탬프 (우측 하단) -->
    <div class="timestamp" id="timestamp">방금 전</div>
  </div>

  <script>
    console.log('🚀 [Notification HTML] 스크립트 시작');
    
    // 🔊 알림 소리는 Main 프로세스에서 재생되므로 여기서는 불필요
    function playNotificationSound(soundEnabled = true) {
      // Main 프로세스(main.js)에서 Windows 시스템 소리를 재생합니다
      console.log('🔊 [Notification HTML] 알림 소리는 Main 프로세스에서 재생됨');
    }
    
    // URL에서 데이터 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');
    console.log('🔗 [Notification HTML] URL 파라미터:', dataParam);
    
    // 소리 설정값 저장 (데이터에서 가져옴)
    let notificationSoundEnabled = true;
    
    if (dataParam) {
      try {
        const data = JSON.parse(decodeURIComponent(dataParam));
        console.log('📦 [Notification HTML] 받은 데이터:', data);
        
        // 소리 설정값 저장
        notificationSoundEnabled = data.soundEnabled !== false;
        console.log('🔊 [Notification HTML] 알림 소리 설정:', notificationSoundEnabled);
        
        // 페이지 로드 시 소리 재생 (설정값 확인)
        playNotificationSound(notificationSoundEnabled);
        
        // 발신자 이름 설정
        if (data.senderName) {
          console.log('✅ [Notification HTML] senderName 설정:', data.senderName);
          document.getElementById('senderName').textContent = data.senderName;
        } else {
          console.warn('⚠️ [Notification HTML] senderName 없음');
        }
        
        // 아바타 설정
        const avatarElement = document.getElementById('avatar');
        if (data.senderAvatar && data.senderAvatar.startsWith('http')) {
          console.log('✅ [Notification HTML] 아바타 이미지 설정:', data.senderAvatar);
          avatarElement.innerHTML = `<img src="${data.senderAvatar}" alt="avatar" />`;
        } else if (data.senderName) {
          // 이름의 첫 글자를 아바타로 사용
          const initial = data.senderName.charAt(0).toUpperCase();
          console.log('✅ [Notification HTML] 아바타 이니셜 설정:', initial);
          avatarElement.textContent = initial;
        } else {
          console.warn('⚠️ [Notification HTML] 아바타 정보 없음, 기본값 유지');
        }
        
        // 시간 설정
        const timestampElement = document.getElementById('timestamp');
        if (data.timestamp) {
          const time = new Date(data.timestamp);
          const now = new Date();
          const diff = Math.floor((now - time) / 1000);
          
          if (diff < 60) {
            timestampElement.textContent = '방금 전';
          } else if (diff < 3600) {
            timestampElement.textContent = `${Math.floor(diff / 60)}분 전`;
          } else if (diff < 86400) {
            timestampElement.textContent = `${Math.floor(diff / 3600)}시간 전`;
          } else {
            timestampElement.textContent = time.toLocaleString('ko-KR', {
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });
          }
        }
        
        // 제목 설정 (아이콘 포함)
        const titleElement = document.getElementById('title');
        const title = data.title || '알림';
        
        // 타이틀에 따라 루시드 아이콘 SVG 추가
        let iconSvg = '';
        if (title.includes('댓글 : 생산관리부 요청사항')) {
          // 댓글 알림 - MessageSquare 아이콘 (파란색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
        } else if (title.includes('생산일정')) {
          // 생산일정 변경 - CalendarDays 아이콘 (초록색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>`;
        } else if (title.includes('생산관리부 요청사항')) {
          // 기존 생산관리부 요청사항 - CalendarClock 아이콘 (파란색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></svg>`;
        } else if (title.includes('부족분 신청')) {
          // AlertTriangle 아이콘 (주황색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`;
        } else if (title.includes('생산일보')) {
          // 생산일보 - FileText 아이콘 (초록색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>`;
        } else if (title.includes('샘플') && title.includes('상태')) {
          // 샘플 요청 상태 변경 - TestTube 아이콘 (파란색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6l-2 4v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6l-2-4V2"/><path d="M9 2h6"/><path d="M9 8h6"/></svg>`;
        } else if (title.includes('샘플 요청')) {
          // 샘플 요청 - TestTube 아이콘 (보라색)
          iconSvg = `<svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6l-2 2v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-8l-2-2V2"/><path d="M9 2h6"/><path d="M12 10v4"/></svg>`;
        }
        
        titleElement.innerHTML = iconSvg + '<span>' + title + '</span>';
        
        // 중앙 정보 설정 (중앙 상단) - requestType, category, type 등 다양한 용도로 사용
        const centerInfoElement = document.getElementById('centerInfo');
        const centerInfoValue = data.requestType || data.category || data.type || data.centerInfo;
        console.log('🔍 [Notification HTML] centerInfo 디버깅:', {
          data: data,
          requestType: data.requestType,
          category: data.category,
          type: data.type,
          centerInfo: data.centerInfo,
          centerInfoValue: centerInfoValue
        });
        if (centerInfoValue) {
          console.log('✅ [Notification HTML] centerInfo 설정:', centerInfoValue);
          centerInfoElement.textContent = centerInfoValue;
          centerInfoElement.style.display = 'block';
        } else {
          console.log('❌ [Notification HTML] centerInfo 값 없음');
          centerInfoElement.style.display = 'none';
        }

        // 서브타이틀 설정 (제품명)
        const subtitleElement = document.getElementById('subtitle');
        if (data.productName || data.subtitle) {
          const subtitleText = data.productName || data.subtitle;
          console.log('✅ [Notification HTML] subtitle 설정:', subtitleText);
          subtitleElement.textContent = subtitleText;
          subtitleElement.style.display = 'block';
        } else {
          subtitleElement.style.display = 'none';
        }
        
        // 내용 설정 (요청내용)
        document.getElementById('body').textContent = data.body || '';
      } catch (error) {
        console.error('알림 데이터 파싱 실패:', error);
      }
    } else {
      // 데이터가 없어도 기본 소리 재생 (설정값이 true일 때만)
      playNotificationSound(notificationSoundEnabled);
    }

    // 알림 닫기 함수 (애니메이션 포함)
    function closeNotification() {
      const notification = document.getElementById('notification');
      notification.classList.add('closing');
      
      // 애니메이션 완료 후 윈도우 닫기
      setTimeout(() => {
        window.close();
      }, 200); // 애니메이션 시간과 동일 (0.2초)
    }

    // 닫기 버튼 클릭 이벤트
    document.getElementById('closeBtn').addEventListener('click', (event) => {
      event.stopPropagation();
      closeNotification();
    });

    // 알림 클릭 이벤트 (메인 윈도우로 포커스)
    document.getElementById('notification').addEventListener('click', () => {
      // Electron IPC를 통해 메인 프로세스에 알림
      if (window.electronNotification) {
        window.electronNotification.clicked();
      }
    });

    // 외부에서 닫기 요청 받을 수 있도록 전역 함수로 노출
    window.closeWithAnimation = closeNotification;
  </script>
</body>
</html>
