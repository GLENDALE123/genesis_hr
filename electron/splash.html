<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMS 통합관리시스템</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, #ffffff 100%);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, #09090b 100%);
      }
    }
    
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
    }
    
    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .app-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #09090b;
      text-align: center;
      letter-spacing: -0.02em;
    }
    
    @media (prefers-color-scheme: dark) {
      .app-title {
        color: #fafafa;
      }
    }
    
    .loading-indicator {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      animation: loadingDot 1.4s ease-in-out infinite;
    }
    
    .loading-dot:nth-child(1) {
      animation-delay: 0s;
    }
    
    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes loadingDot {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    .progress-container {
      width: 100%;
      max-width: 280px;
      margin-top: 1.5rem;
      height: 4px;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    
    @media (prefers-color-scheme: dark) {
      .progress-container {
        background: rgba(37, 99, 235, 0.15);
      }
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease-out;
      animation: progressShimmer 2s ease-in-out infinite;
    }
    
    @keyframes progressShimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    
    .progress-text {
      font-size: 0.75rem;
      color: #71717a;
      margin-top: 0.5rem;
      text-align: center;
      min-height: 1rem;
    }
    
    @media (prefers-color-scheme: dark) {
      .progress-text {
        color: #a1a1aa;
      }
    }
    
    .status-text {
      font-size: 0.9375rem;
      font-weight: 500;
      color: #09090b;
      margin-top: 1rem;
      text-align: center;
      min-height: 1.5rem;
    }
    
    @media (prefers-color-scheme: dark) {
      .status-text {
        color: #fafafa;
      }
    }
    
    .detail-text {
      font-size: 0.8125rem;
      color: #71717a;
      margin-top: 0.5rem;
      text-align: center;
      min-height: 1rem;
      opacity: 0.8;
    }
    
    @media (prefers-color-scheme: dark) {
      .detail-text {
        color: #a1a1aa;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <img src="../public/tms-logo.png" alt="TMS Logo" class="logo" onerror="this.style.display='none'">
    </div>
    
    <div class="app-title">TMS 통합관리시스템</div>
    
    <div class="loading-indicator">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    
    <div class="status-text" id="status-text">앱을 시작하는 중...</div>
    <div class="detail-text" id="detail-text">초기화 중...</div>
    
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-text" id="progress-text">0%</div>
  </div>
  
  <script>
    // 상태 텍스트 업데이트
    const statusText = document.getElementById('status-text');
    const detailText = document.getElementById('detail-text');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    
    // 진행률 관리
    let currentProgress = 0;
    let targetProgress = 0;
    
    function updateProgress(value) {
      targetProgress = Math.min(100, Math.max(0, value));
      const progressInterval = setInterval(() => {
        if (currentProgress < targetProgress) {
          currentProgress = Math.min(targetProgress, currentProgress + 2);
          if (progressBar) {
            progressBar.style.width = currentProgress + '%';
          }
          if (progressText) {
            progressText.textContent = Math.round(currentProgress) + '%';
          }
        } else {
          clearInterval(progressInterval);
        }
      }, 30);
    }
    
    // 초기 자동 상태 변경 (fallback)
    const statusMessages = [
      { main: '앱을 시작하는 중...', detail: '초기 설정 확인', progress: 10 },
      { main: '시스템 초기화 중...', detail: '컴포넌트 로드', progress: 30 },
      { main: '데이터 준비 중...', detail: '캐시 활성화', progress: 60 },
      { main: '거의 완료되었습니다...', detail: '마지막 단계', progress: 90 }
    ];
    
    let currentStatus = 0;
    const statusInterval = setInterval(() => {
      if (currentStatus < statusMessages.length - 1) {
        currentStatus++;
        const message = statusMessages[currentStatus];
        if (statusText) {
          statusText.textContent = message.main;
        }
        if (detailText) {
          detailText.textContent = message.detail;
        }
        updateProgress(message.progress);
      }
    }, 800);
    
    // 전역 함수로 진행률 업데이트 가능하도록
    window.updateProgress = updateProgress;
    window.updateStatus = function(message, detail, progress) {
      if (statusText) {
        statusText.textContent = message || statusText.textContent;
      }
      if (detailText) {
        detailText.textContent = detail || detailText.textContent;
      }
      if (progress !== undefined) {
        updateProgress(progress);
      }
    };
    
    // 초기 진행률 설정
    updateProgress(5);
    
    // 정리
    window.addEventListener('beforeunload', () => {
      clearInterval(statusInterval);
    });
  </script>
</body>
</html>
